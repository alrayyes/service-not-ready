name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A superseded pull request run is cancelled. A run on main never is: cancelling it between
# the release job and the image job would leave a tag with no image behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Works out which of the filtered jobs a pull request touches. A skipped job reports
  # success, so branch protection can still require it; a `paths:` filter on the workflow
  # would leave it pending forever. A push to main runs everything, release included.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.groups.outputs.lint }}
      dockerfile: ${{ steps.groups.outputs.dockerfile }}
      test: ${{ steps.groups.outputs.test }}
      prose: ${{ steps.groups.outputs.prose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - id: groups
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${EVENT}" = pull_request ]; then
            git diff --name-only "${BASE}...HEAD" | bun ci/changed-groups.ts >> "$GITHUB_OUTPUT"
          else
            printf 'lint=true\ndockerfile=true\ntest=true\nprose=true\n' >> "$GITHUB_OUTPUT"
          fi

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache git ca-certificates
      # fetch-depth: 0, or the job passes having scanned nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: gitleaks git --redact --no-banner

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run sort
      # Unit-test coverage, for visibility and not as a target. It covers only ./ci: the
      # Playwright tests drive a container, so there is no line coverage to measure.
      - name: Test with coverage
        run: |
          status=0
          bun test --coverage ./ci > coverage.txt 2>&1 || status=$?
          cat coverage.txt
          {
            echo '### Unit-test coverage (`bun test --coverage ./ci`)'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Style is advice, so Vale only fails the job on its error-level rules (a product name
  # spelled wrong); warnings print. Official image, run through the same script as a local run.
  prose:
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: jdkato/vale:v3.24.0@sha256:f5a09410093936d4919d868120786da9789e2652ac321c66a895403eca020ae4
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache bash git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/lint-prose.sh

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Retried: bun audit talks to the npm registry, and a dropped connection fails the job
      # the same way a real advisory would. A genuine finding fails every attempt.
      - run: |
          for attempt in 1 2 3; do
            timeout 60 bun audit && exit 0
            echo "bun audit failed (attempt ${attempt}/3), retrying in 10s..." >&2
            sleep 10
          done
          exit 1

  dockerfile:
    needs: changes
    if: needs.changes.outputs.dockerfile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: hadolint/hadolint:v2.14.0-alpine@sha256:7aba693c1442eb31c0b015c129697cb3b6cb7da589d85c7562f9deb435a6657c
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: hadolint Dockerfile

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD --verbose

  # Builds the image and runs it with the hardened settings from the README: the 503 and its
  # headers, non-root, read-only root, the healthcheck, and an axe-core scan of the page.
  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        continue-on-error: true
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # Proposes the release as a pull request and, once that merges, cuts the tag and GitHub
  # release through the API. RELEASE_TOKEN, not GITHUB_TOKEN: a pull request authored by
  # GITHUB_TOKEN sits at action_required with no checks run.
  release:
    needs: [secrets, lint, prose, audit, dockerfile, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ fromJSON(steps.release.outputs.outputs).release_created }}
      tag_name: ${{ fromJSON(steps.release.outputs.outputs).tag_name }}
    steps:
      # Wrapped in a retry: a transient GitHub API error shouldn't strand a release. The
      # wrapper exposes the action's outputs as one JSON map.
      - uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        id: release
        with:
          action: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            token: ${{ secrets.RELEASE_TOKEN }}
            config-file: release-please-config.json
            manifest-file: .release-please-manifest.json

  # Publishes only when a release was cut. release-please's tag never triggers a workflow of
  # its own (GitHub's recursion guard), so this runs in the same invocation, after `release`,
  # and builds the commit that release landed on. That commit is the tag, so there is no
  # separate retag step: the image is built with its version from the start.
  image:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        run: |
          set -eu
          image="ghcr.io/${{ github.repository }}"
          tag="${{ needs.release.outputs.tag_name }}"
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.licenses=GPL-3.0-only" \
            --label "org.opencontainers.image.version=${tag}" \
            -t "${image}:${tag}" -t "${image}:latest" .
          docker push "${image}:${tag}"
          docker push "${image}:latest"
          # What a deploy pins: tag and digest.
          repo_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:${tag}")
          echo "Pinned form for the deploy: ${image}:${tag}@${repo_digest#*@}"
          echo "digest=${repo_digest#*@}" >> "$GITHUB_OUTPUT"
      - uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
        with:
          action: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            subject-name: ghcr.io/${{ github.repository }}
            subject-digest: ${{ steps.push.outputs.digest }}
            push-to-registry: true
      # The README embeds releases/latest/download/screenshot-<name>.png, so each release
      # carries a fresh shot of every page of the image it just published and the README never
      # needs a commit.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Attach a screenshot of each page to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.release.outputs.tag_name }}
        run: |
          bun scripts/screenshot.ts screenshots
          gh release upload "${{ needs.release.outputs.tag_name }}" screenshots/*.png --clobber
