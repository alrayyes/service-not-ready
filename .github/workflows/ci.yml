name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Hooks are for a developer's machine. A job that runs `git commit` or `git push` itself
# mustn't fire them, and `bun install` shouldn't install them.
env:
  LEFTHOOK: "0"

# A superseded pull request run is cancelled. A run on main never is: cancelling it between
# the release job and the image job would leave a tag with no image behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Works out which of the filtered jobs a pull request touches. A skipped job reports
  # success, so branch protection can still require it; a `paths:` filter on the workflow
  # would leave it pending forever. A push to main runs everything, release included.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.groups.outputs.lint }}
      dockerfile: ${{ steps.groups.outputs.dockerfile }}
      test: ${{ steps.groups.outputs.test }}
      prose: ${{ steps.groups.outputs.prose }}
      markdown: ${{ steps.groups.outputs.markdown }}
      yaml: ${{ steps.groups.outputs.yaml }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - id: groups
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${EVENT}" = pull_request ]; then
            git diff --name-only "${BASE}...HEAD" | bun ci/changed-groups.ts >> "$GITHUB_OUTPUT"
          else
            printf 'lint=true\ndockerfile=true\ntest=true\nprose=true\nmarkdown=true\nyaml=true\n' >> "$GITHUB_OUTPUT"
          fi

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache git ca-certificates
      # fetch-depth: 0, or the job passes having scanned nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: gitleaks git --redact --no-banner

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run sort
      # Unit-test coverage, for visibility and not as a target. It covers only ./ci: the
      # Playwright tests drive a container, so there is no line coverage to measure. The same
      # run writes the JUnit file the reports page publishes.
      - name: Test with coverage
        run: |
          mkdir -p reports
          status=0
          bun test --coverage --coverage-reporter=text --coverage-reporter=lcov --reporter=junit --reporter-outfile=reports/unit.xml ./ci > coverage.txt 2>&1 || status=$?
          cat coverage.txt
          {
            echo '### Unit-test coverage (`bun test --coverage ./ci`)'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # Cobertura is the format every coverage viewer reads; lcov.info stays beside it. This
      # runs on pull requests too, so a broken conversion fails before the merge.
      - name: Convert coverage to Cobertura and HTML
        run: |
          pipx run --spec lcov_cobertura==2.1.1 lcov_cobertura coverage/lcov.info --output coverage/coverage.xml
          pipx run --spec pycobertura==4.1.0 pycobertura show --format html --output coverage/index.html coverage/coverage.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-unit
          path: reports/unit.xml
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-coverage
          path: |
            coverage/coverage.xml
            coverage/index.html
            coverage/lcov.info
          retention-days: 7
      # Dependabot's runs don't get repository secrets, so an upload there would fail the job
      # on every bump.
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: github.actor != 'dependabot[bot]'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: true

  # Style is advice, so Vale only fails the job on its error-level rules (a product name
  # spelled wrong); warnings print. Official image, run through the same script as a local run.
  prose:
    needs: changes
    if: needs.changes.outputs.prose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: jdkato/vale:v3.24.0@sha256:f5a09410093936d4919d868120786da9789e2652ac321c66a895403eca020ae4
      options: --entrypoint ""
    steps:
      - run: apk add --no-cache bash git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/lint-prose.sh

  # Markdown has three tiers, each its own job so a red run says which (rules/markdown.md):
  # layout (Prettier), structure (markdownlint-cli2) and grammar (LTeX). Prettier runs
  # first in a hook, but they're independent here.
  markdown-format:
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint:md:format

  markdown-structure:
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint:md:structure

  # LTeX exits 3 on a finding. The canary proves that still holds, so a green run can't mean
  # the tool stopped checking.
  markdown-grammar:
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/lint-grammar.sh
      - name: Canary, a known error must fail
        run: |
          printf 'This is an university.\n' > canary.md
          if scripts/lint-grammar.sh canary.md; then
            echo "LTeX passed a document with 'an university'" >&2
            exit 1
          fi

  # Prettier owns YAML layout the way it owns Markdown's.
  yaml-format:
    needs: changes
    if: needs.changes.outputs.yaml == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint:yaml:format

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # Retried: bun audit talks to the npm registry, and a dropped connection fails the job
      # the same way a real advisory would. A genuine finding fails every attempt.
      # One advisory is ignored, by ID (#46): GHSA-vfj7-8cjw-p6xm, `braces` stack exhaustion on
      # deeply nested glob patterns. No patched version exists. It reaches us only through
      # markdownlint-cli2's globbing of our own committed Markdown, never untrusted patterns.
      # Drop the ignore when braces ships a fix.
      - run: |
          for attempt in 1 2 3; do
            timeout 60 bun audit --ignore=GHSA-vfj7-8cjw-p6xm && exit 0
            echo "bun audit failed (attempt ${attempt}/3), retrying in 10s..." >&2
            sleep 10
          done
          exit 1

  dockerfile:
    needs: changes
    if: needs.changes.outputs.dockerfile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: hadolint/hadolint:v2.14.0-alpine@sha256:7aba693c1442eb31c0b015c129697cb3b6cb7da589d85c7562f9deb435a6657c
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: hadolint Dockerfile

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD --verbose

  # Builds the image and runs it with the hardened settings from the README: the 503 and its
  # headers, non-root, read-only root, the healthcheck, and an axe-core scan of the page.
  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        continue-on-error: true
        with:
          name: test-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-e2e
          path: reports/e2e.xml
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-playwright
          path: playwright-report/
          retention-days: 7

  # Gathers the reports into one site/ directory and, on a push to main, hands it to the pages
  # job. It runs on pull requests too, so a broken assembly fails before the merge. A job a
  # pull request filtered out left no artifact, so those downloads may be empty there; on main
  # every job runs, and a missing one fails the run.
  reports:
    needs:
      [
        secrets,
        lint,
        prose,
        markdown-format,
        markdown-structure,
        markdown-grammar,
        yaml-format,
        audit,
        dockerfile,
        test,
      ]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          name: report-unit
          path: site/reports/tests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          name: report-e2e
          path: site/reports/tests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          name: report-playwright
          path: site/reports/tests/playwright
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          name: report-coverage
          path: site/reports/coverage
      - run: mkdir -p site/reports && bun scripts/reports-index.ts site/reports
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          path: site

  # The one Pages deployment for this repo. Only a push to main gets here, behind every check.
  pages:
    needs: reports
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # The deploy succeeds whether or not the files are served, so fetch the real file and
      # check its content. Retries cover the CDN catching up.
      - name: Check the live coverage report
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --output coverage.xml "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml

  # Proposes the release as a pull request and, once that merges, cuts the tag and GitHub
  # release through the API. RELEASE_TOKEN, not GITHUB_TOKEN: a pull request authored by
  # GITHUB_TOKEN sits at action_required with no checks run.
  release:
    needs:
      [
        secrets,
        lint,
        prose,
        markdown-format,
        markdown-structure,
        markdown-grammar,
        yaml-format,
        audit,
        dockerfile,
        test,
      ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Called directly: Wandalen/wretry.action reports success without running the action
      # under Node 24, which silently stops releases.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishes only when a release was cut. release-please's tag never triggers a workflow of
  # its own (GitHub's recursion guard), so this runs in the same invocation, after `release`,
  # and builds the commit that release landed on. That commit is the tag, so there is no
  # separate retag step: the image is built with its version from the start.
  image:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        run: |
          set -eu
          image="ghcr.io/${{ github.repository }}"
          tag="${{ needs.release.outputs.tag_name }}"
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.licenses=GPL-3.0-only" \
            --label "org.opencontainers.image.version=${tag}" \
            -t "${image}:${tag}" -t "${image}:latest" .
          docker push "${image}:${tag}"
          docker push "${image}:latest"
          # What a deploy pins: tag and digest.
          repo_digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${image}:${tag}")
          echo "Pinned form for the deploy: ${image}:${tag}@${repo_digest#*@}"
          echo "digest=${repo_digest#*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # The README embeds releases/latest/download/screenshot-<name>.png, so each release
      # carries a fresh shot of every page of the image it just published and the README never
      # needs a commit.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Attach a screenshot of each page to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.release.outputs.tag_name }}
        run: |
          bun scripts/screenshot.ts screenshots
          gh release upload "${{ needs.release.outputs.tag_name }}" screenshots/*.png --clobber
